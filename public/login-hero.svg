<svg width="640" height="560" viewBox="0 0 640 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ITBD Labs illustration placeholder">
  <defs>
    <linearGradient id="cubeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00afdd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00afdd" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bed62f"/>
      <stop offset="1" stop-color="#a9c020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00afdd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00afdd" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="320" cy="300" rx="240" ry="210" fill="url(#glow)"/>

  <!-- orbiting feature tiles -->
  <g opacity="0.9">
    <g>
      <rect x="70" y="120" width="120" height="120" rx="20" fill="#0a1826" stroke="#00afdd" stroke-opacity="0.5"/>
      <rect x="94" y="150" width="72" height="46" rx="6" fill="none" stroke="#00afdd" stroke-width="3"/>
      <text x="130" y="222" text-anchor="middle" fill="#00afdd" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SIMULATORS</text>
    </g>
    <g>
      <rect x="450" y="120" width="120" height="120" rx="20" fill="#0a1826" stroke="#00afdd" stroke-opacity="0.5"/>
      <circle cx="510" cy="172" r="26" fill="none" stroke="#00afdd" stroke-width="3"/>
      <text x="510" y="222" text-anchor="middle" fill="#00afdd" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">COMMUNICATION</text>
    </g>
    <g>
      <rect x="70" y="330" width="120" height="120" rx="20" fill="#0a1826" stroke="#00afdd" stroke-opacity="0.5"/>
      <circle cx="130" cy="382" r="24" fill="none" stroke="#00afdd" stroke-width="3"/>
      <circle cx="130" cy="382" r="6" fill="#00afdd"/>
      <text x="130" y="432" text-anchor="middle" fill="#00afdd" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PRACTICE</text>
    </g>
    <g>
      <rect x="450" y="330" width="120" height="120" rx="20" fill="#0a1826" stroke="#00afdd" stroke-opacity="0.5"/>
      <path d="M486 400 l14 -18 l14 10 l16 -26" fill="none" stroke="#00afdd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="510" y="432" text-anchor="middle" fill="#00afdd" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">IMPROVE</text>
    </g>
  </g>

  <!-- central isometric cube stack -->
  <g transform="translate(320 300)" filter="url(#blur)" opacity="0.5">
    <polygon points="0,-70 90,-20 0,30 -90,-20" fill="#00afdd"/>
  </g>
  <g transform="translate(320 300)">
    <!-- base cube -->
    <polygon points="0,-40 90,10 0,60 -90,10" fill="url(#cubeGrad)" stroke="#00afdd" stroke-opacity="0.7"/>
    <polygon points="-90,10 0,60 0,120 -90,70" fill="#0b2f42" stroke="#00afdd" stroke-opacity="0.4"/>
    <polygon points="90,10 0,60 0,120 90,70" fill="#082433" stroke="#00afdd" stroke-opacity="0.4"/>
    <!-- floating top cube -->
    <g transform="translate(0 -70)">
      <polygon points="0,-30 45,-5 0,20 -45,-5" fill="url(#topGrad)"/>
      <polygon points="-45,-5 0,20 0,60 -45,35" fill="#8ca01c"/>
      <polygon points="45,-5 0,20 0,60 45,35" fill="#a9c020"/>
    </g>
  </g>

  <!-- reflection line -->
  <ellipse cx="320" cy="452" rx="150" ry="16" fill="#00afdd" opacity="0.18"/>
</svg>
